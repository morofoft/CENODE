<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | CENODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <header class="bg-emerald-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-lg text-emerald-800">
                    <i class="fas fa-users-cog text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold leading-tight">Administración de Personal</h1>
            </div>
            <a href="index.html" class="text-emerald-100 hover:text-white transition-colors">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <div class="w-full lg:w-1/3">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-8">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-emerald-800">
                        <i class="fas fa-user-plus text-lg"></i> Nuevo Usuario
                    </h2>
                    
                    <form id="userForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Nombre Completo</label>
                            <input type="text" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Email / Usuario</label>
                            <input type="email" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Departamento</label>
                            <select class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                                <option>Administración</option>
                                <option>Rayos X</option>
                                <option>Laboratorio</option>
                                <option>Sonografía</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Rol de Acceso</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-emerald-50 transition-colors">
                                    <input type="radio" name="role" value="admin" class="text-emerald-600 mr-2">
                                    <span class="text-sm">Admin</span>
                                </label>
                                <label class="flex items-center p-3 border border-emerald-600 bg-emerald-50 rounded-xl cursor-pointer">
                                    <input type="radio" name="role" value="user
