<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | CENODE Audit Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .shadow-xl, .shadow-sm { box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
            main { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            table { font-size: 10px; }
        }
        /* Scrollbar estética para tablas anchas */
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f1f1; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans" onload="initReporte()">

    <header class="bg-emerald-800 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="h-10 w-10 md:h-12 md:w-12 bg-white rounded-xl overflow-hidden shadow-inner flex items-center justify-center">
              <img src="img/logo-cenode.webp" alt="Logo CENODE" class="h-full w-full object-contain p-1">
            </div>
            <div class="flex flex-col">
              <span class="text-xl md:text-2xl font-black leading-none tracking-tight">CENODE</span>
              <span class="text-[10px] md:text-[11px] uppercase font-bold text-emerald-300 tracking-[0.2em] leading-tight">Audit System</span>
            </div>
          </div>
          <div class="flex items-center gap-4">
              <button onclick="window.print()" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-bold transition-all">
                  <i class="fas fa-print mr-2"></i> Imprimir PDF
              </button>
              <a href="data.html" class="text-emerald-200 hover:text-white transition-colors">
                  <i class="fas fa-cog"></i>
              </a>
          </div>
        </div>
      </header>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 no-print">
        <div class="max-w-7xl mx-auto px-4 flex gap-8">
            <a href="index.html" class="py-4 px-2 text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-2">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="registro.html" class="py-4 px-2 text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-2">
                <i class="fas fa-edit"></i> Registro
            </a>
            <a href="reporte.html" class="py-4 px-2 border-b-2 border-emerald-600 text-emerald-600 font-semibold flex items-center gap-2">
                <i class="fas fa-file-medical-alt"></i> Reportes
            </a>
        </div>
    </nav>

    <main class="max-w-[95%] mx-auto py-8 space-y-6">

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 no-print">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Desde</label>
                    <input type="date" id="f-desde" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Hasta</label>
                    <input type="date" id="f-hasta" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Departamento</label>
                    <select id="f-dept" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">Todos los Departamentos</option>
                        <option>Electrocardiograma</option>
                        <option>Glucometría</option>
                        <option>Rayos x</option>
                        <option>Mamografía</option>
                        <option>Densitometría</option>
                        <option>Sonografía</option>
                        <option>Doppler</option>
                        <option>Holter</option>
                        <option>MAPA</option>
                        <option>Ecocardiograma</option>
                        <option>Biopsia</option>
                        <option>OCT</option>
                        <option>Laboratorio</option>
                        <option>Campimetria</option>
                        <option>Microscopia</option>
                        <option>Paquimetria</option>
                        <option>Biometria</option>
                        <option>Angiografia</option>
                        </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="renderReporte()" class="flex-1 bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2 rounded-xl transition-all shadow-md">Filtrar</button>
                    <button onclick="resetFiltros()" class="px-4 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition-all"><i class="fas fa-undo"></i></button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                <h3 class="font-black text-slate-700 uppercase tracking-tighter">Detalle de Auditoría</h3>
                <div id="print-header" class="hidden show-on-print text-right">
                    <p class="text-xs font-bold text-emerald-800">CENODE Audit System</p>
                    <p id="print-date" class="text-[10px] text-slate-400"></p>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-slate-100">
                            <th class="px-4 py-4">Fecha</th>
                            <th class="px-4 py-4">Departamento</th>
                            <th class="px-4 py-4 text-center bg-blue-50/30">Total</th>
                            <th class="px-4 py-4 text-center">Fact OK</th>
                            <th class="px-4 py-4 text-center">Real OK</th>
                            <th class="px-4 py-4 text-center">Res OK</th>
                            <th class="px-4 py-4 text-center bg-emerald-50/30">Env OK</th>
                            <th class="px-4 py-4 text-center bg-red-50/30">No Env</th>
                            <th class="px-4 py-4 text-right">Monto</th>
                            <th class="px-4 py-4 text-center">% Cumpl.</th>
                        </tr>
                    </thead>
                    <tbody id="reporteBody" class="divide-y divide-slate-100 text-sm">
                        </tbody>
                </table>
            </div>
            
            <div class="bg-slate-50 p-6 grid grid-cols-2 md:grid-cols-5 gap-4 border-t border-slate-200">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Procesados</p>
                    <p id="res-total" class="text-lg font-black text-slate-700">0</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-emerald-500 uppercase">Enviados</p>
                    <p id="res-env" class="text-lg font-black text-emerald-600">0</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-red-400 uppercase">Pendientes</p>
                    <p id="res-noenv" class="text-lg font-black text-red-500">0</p>
                </div>
                <div class="md:col-span-2 text-right">
                    <p class="text-[10px] font-bold text-emerald-800 uppercase">Total Monto</p>
                    <p id="res-monto" class="text-2xl font-black text-emerald-900">$0.00</p>
                </div>
            </div>

            <div id="noData" class="hidden p-20 text-center">
                <i class="fas fa-folder-open text-4xl text-slate-200 mb-3"></i>
                <p class="text-slate-400 font-medium">No hay registros con esos criterios.</p>
            </div>
        </div>
    </main>

    <script>
        function initReporte() {
            const hoy = new Date();
            const haceMes = new Date();
            haceMes.setDate(1); // Inicio de mes

            document.getElementById('f-hasta').valueAsDate = hoy;
            document.getElementById('f-desde').valueAsDate = haceMes;
            document.getElementById('print-date').innerText = `Generado: ${hoy.toLocaleString()}`;

            renderReporte();
        }

        function resetFiltros() {
            initReporte();
            document.getElementById('f-dept').value = "";
        }

        function renderReporte() {
            const desde = document.getElementById('f-desde').value;
            const hasta = document.getElementById('f-hasta').value;
            const dept = document.getElementById('f-dept').value;

            const db = JSON.parse(localStorage.getItem('auditData')) || [];

            const filtrados = db.filter(r => {
                const matchFecha = (!desde || r.fecha >= desde) && (!hasta || r.fecha <= hasta);
                const matchDept = !dept || r.departamento === dept;
                return matchFecha && matchDept;
            });

            const body = document.getElementById('reporteBody');
            const noData = document.getElementById('noData');
            body.innerHTML = "";

            if (filtrados.length === 0) {
                noData.classList.remove('hidden');
            } else {
                noData.classList.add('hidden');

                let tProc = 0, tEnv = 0, tNoEnv = 0, tMonto = 0;

                // Ordenar por fecha descendente
                filtrados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).forEach(r => {
                    const porc = r.total > 0 ? Math.round((r.enviadook / r.total) * 100) : 0;
                    
                    tProc += Number(r.total);
                    tEnv += Number(r.enviadook);
                    tNoEnv += Number(r.noenviado);
                    tMonto += Number(r.monto);

                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-4 font-medium text-slate-500 whitespace-nowrap">${r.fecha}</td>
                            <td class="px-4 py-4 font-bold text-slate-800">${r.departamento}</td>
                            <td class="px-4 py-4 text-center font-bold bg-blue-50/20">${r.total}</td>
                            <td class="px-4 py-4 text-center text-slate-600">${r.factok || 0}</td>
                            <td class="px-4 py-4 text-center text-slate-600">${r.realok || 0}</td>
                            <td class="px-4 py-4 text-center text-slate-600">${r.resultadook || 0}</td>
                            <td class="px-4 py-4 text-center font-black text-emerald-600 bg-emerald-50/20">${r.enviadook}</td>
                            <td class="px-4 py-4 text-center font-black text-red-400 bg-red-50/20">${r.noenviado}</td>
                            <td class="px-4 py-4 text-right font-mono font-bold text-slate-700">$${Number(r.monto).toFixed(2)}</td>
                            <td class="px-4 py-4 text-center">
                                <span class="px-2 py-1 rounded-lg text-[10px] font-black ${porc >= 90 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                    ${porc}%
                                </span>
                            </td>
                        </tr>
                    `;
                    body.innerHTML += row;
                });

                document.getElementById('res-total').innerText = tProc;
                document.getElementById('res-env').innerText = tEnv;
                document.getElementById('res-noenv').innerText = tNoEnv;
                document.getElementById('res-monto').innerText = `$${tMonto.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            }
        }
    </script>
</body>
</html>
