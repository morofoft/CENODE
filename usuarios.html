<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario | CENODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans" onload="cargarPerfil()">

    <header class="bg-emerald-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 bg-white rounded-xl overflow-hidden shadow-inner flex items-center justify-center">
                    <img src="tu-logo.png" alt="Logo" class="h-full w-full object-contain p-1">
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-black leading-none tracking-tight">CENODE</span>
                    <span class="text-[10px] uppercase font-bold text-emerald-300 tracking-widest">Audit System</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="nav-user-name" class="hidden md:block text-xs font-bold opacity-80">Usuario</span>
                <img id="nav-user-img" src="https://ui-avatars.com/api/?name=User&background=065f46&color=fff" class="w-8 h-8 rounded-full border border-emerald-600 object-cover">
            </div>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 flex gap-8">
            <a href="index.html" class="py-4 px-2 text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-2">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="registro.html" class="py-4 px-2 text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> Registro
            </a>
            <a href="usuario.html" class="py-4 px-2 border-b-2 border-emerald-600 text-emerald-600 font-bold flex items-center gap-2">
                <i class="fas fa-user-circle"></i> Perfil
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="md:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center">
                    <div class="relative w-32 h-32 mx-auto mb-4">
                        <img id="profile-preview" src="https://ui-avatars.com/api/?name=Admin&size=128&background=065f46&color=fff" 
                             class="w-full h-full rounded-full object-cover border-4 border-slate-50 shadow-lg">
                        <label for="photo-upload" class="absolute bottom-0 right-0 bg-emerald-600 text-white p-2 rounded-full cursor-pointer hover:bg-emerald-700 shadow-md transition-all">
                            <i class="fas fa-camera"></i>
                            <input type="file" id="photo-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
                        </label>
                    </div>
                    <h2 id="summary-name" class="text-xl font-bold text-slate-800 leading-tight">Nombre Usuario</h2>
                    <p id="summary-role" class="text-xs text-slate-400 font-bold uppercase tracking-wider mt-1">Cargo / Posición</p>
                </div>

                <div class="bg-emerald-800 p-6 rounded-3xl text-white shadow-lg shadow-emerald-900/20">
                    <h4 class="text-xs font-bold opacity-70 uppercase mb-4 tracking-widest">Estado del Sistema</h4>
                    <div class="space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="opacity-70">Último Acceso:</span>
                            <span class="font-medium">Hoy, 8:45 AM</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="opacity-70">Versión App:</span>
                            <span class="font-medium">3.1.2</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2">
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">Información del Perfil</h3>
                        <i class="fas fa-user-edit text-slate-300"></i>
                    </div>
                    
                    <form id="profileForm" class="p-8 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase mb-2">Nombre Completo</label>
                                <input type="text" id="user-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="Ej. Valeri Garcia">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase mb-2">Cargo</label>
                                <input type="text" id="user-role" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="Ej. Gerente de Ventas">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2">Correo Electrónico</label>
                            <input type="email" id="user-email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="usuario@clinica.com">
                        </div>

                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2">Departamento Principal</label>
                            <select id="user-dept" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                                <option>Rayos X</option>
                                <option>Laboratorio</option>
                                <option>Sonografía</option>
                                <option>Mamografía</option>
                                <option>Administración</option>
                            </select>
                        </div>

                        <div class="pt-4 border-t border-slate-50">
                            <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                                <i class="fas fa-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Función para previsualizar y guardar la imagen en Base64
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profile-preview');
                const navImg = document.getElementById('nav-user-img');
                output.src = reader.result;
                navImg.src = reader.result;
                // Guardar imagen en LocalStorage
                localStorage.setItem('user_photo', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function cargarPerfil() {
            // Cargar datos guardados
            const nombre = localStorage.getItem('user_name') || "Valeri Camila Garcia";
            const cargo = localStorage.getItem('user_role') || "Gerente de Ventas";
            const email = localStorage.getItem('user_email') || "v.garcia@clinica.com";
            const dept = localStorage.getItem('user_dept') || "Administración";
            const foto = localStorage.getItem('user_photo');

            // Llenar campos
            document.getElementById('user-name').value = nombre;
            document.getElementById('user-role').value = cargo;
            document.getElementById('user-email').value = email;
            document.getElementById('user-dept').value = dept;
            
            // Actualizar textos dinámicos
            document.getElementById('summary-name').innerText = nombre;
            document.getElementById('summary-role').innerText = cargo;
            document.getElementById('nav-user-name').innerText = nombre;

            if(foto) {
                document.getElementById('profile-preview').src = foto;
                document.getElementById('nav-user-img').src = foto;
            }
        }

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('user-name').value;
            const cargo = document.getElementById('user-role').value;
            const email = document.getElementById('user-email').value;
            const dept = document.getElementById('user-dept').value;

            // Guardar en LocalStorage
            localStorage.setItem('user_name', nombre);
            localStorage.setItem('user_role', cargo);
            localStorage.setItem('user_email', email);
            localStorage.setItem('user_dept', dept);

            alert("✅ Perfil actualizado correctamente.");
            location.reload();
        });
    </script>
</body>
</html>
